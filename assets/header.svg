<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" width="100%" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D70F5" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D70F5" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1D70F5" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="900" height="160" rx="12" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1" />

  <!-- Subtle Wave Curves -->
  <path d="M0,130 C200,90 400,160 600,110 C750,75 850,130 900,115 L900,160 L0,160 Z" fill="url(#waveGrad)" />
  <path d="M0,140 C250,110 450,155 650,125 C780,105 850,140 900,135 L900,160 L0,160 Z" fill="url(#waveGrad)" opacity="0.6" />

  <!-- Top Blue Accent Line -->
  <rect x="0" y="0" width="900" height="3" fill="url(#accentGrad)" rx="1.5" />

  <!-- Main Name Text -->
  <text x="50%" y="68" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="1">Hafidz</text>

  <!-- Subtitle -->
  <text x="50%" y="104" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#93C5FD" letter-spacing="2">MOBILE DEVELOPER · ANDROID &amp; FLUTTER</text>
</svg>
